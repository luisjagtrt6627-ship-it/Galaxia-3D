<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universo 3D 🌌</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#info {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 0 10px #fff;
}

#info h1 {
    font-size: 25px;
    margin-bottom: 5px;
}

#info p {
    font-size: 13px;
    opacity: .8;
}

#loading {
    position: fixed;
    inset: 0;
    background: #000;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 20;
    font-size: 20px;
}
</style>
</head>

<body>

<div id="loading">🌌 Cargando universo...</div>

<div id="info">
    <h1>🌌 UNIVERSO 3D</h1>
    <p>Desliza para mover la cámara • Pellizca para acercar</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================
   ESCENA
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000005);

scene.fog = new THREE.FogExp2(0x000008, 0.0007);


/* =========================
   CÁMARA
========================= */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    5000
);

camera.position.set(0, 120, 350);


/* =========================
   RENDER
========================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.body.appendChild(renderer.domElement);


/* =========================
   LUCES
========================= */

scene.add(new THREE.AmbientLight(0x333355, 1.5));

const sunLight = new THREE.PointLight(0xffffff, 8, 1000);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);


/* =========================
   ESTRELLAS
========================= */

const starGeometry = new THREE.BufferGeometry();

const starCount = 8000;

const starPositions = new Float32Array(starCount * 3);

for (let i = 0; i < starCount; i++) {

    const radius = 500 + Math.random() * 1800;

    const theta = Math.random() * Math.PI * 2;

    const phi = Math.acos(
        (Math.random() * 2) - 1
    );

    starPositions[i * 3] =
        radius * Math.sin(phi) * Math.cos(theta);

    starPositions[i * 3 + 1] =
        radius * Math.cos(phi);

    starPositions[i * 3 + 2] =
        radius * Math.sin(phi) * Math.sin(theta);
}

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(starPositions, 3)
);

const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 2,
    transparent: true,
    opacity: .9
});

const stars = new THREE.Points(
    starGeometry,
    starMaterial
);

scene.add(stars);


/* =========================
   GALAXIA
========================= */

const galaxyGeometry = new THREE.BufferGeometry();

const galaxyCount = 12000;

const galaxyPositions =
    new Float32Array(galaxyCount * 3);

for (let i = 0; i < galaxyCount; i++) {

    const radius =
        Math.pow(Math.random(), .6) * 400;

    const arms = 5;

    const arm =
        Math.floor(Math.random() * arms);

    const angle =
        radius * .035 +
        (arm / arms) * Math.PI * 2;

    const spread =
        (Math.random() - .5) *
        (0.8 + radius / 100);

    galaxyPositions[i * 3] =
        Math.cos(angle + spread) * radius;

    galaxyPositions[i * 3 + 1] =
        (Math.random() - .5) *
        25 *
        (1 - radius / 500);

    galaxyPositions[i * 3 + 2] =
        Math.sin(angle + spread) * radius;
}

galaxyGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        galaxyPositions,
        3
    )
);

const galaxyMaterial = new THREE.PointsMaterial({
    color: 0x88aaff,
    size: 1.5,
    transparent: true,
    opacity: .8
});

const galaxy =
    new THREE.Points(
        galaxyGeometry,
        galaxyMaterial
    );

scene.add(galaxy);


/* =========================
   SOL
========================= */

const sunGeometry =
    new THREE.SphereGeometry(28, 64, 64);

const sunMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffcc33
    });

const sun =
    new THREE.Mesh(
        sunGeometry,
        sunMaterial
    );

scene.add(sun);


/* =========================
   BRILLO DEL SOL
========================= */

const glowGeometry =
    new THREE.SphereGeometry(40, 32, 32);

const glowMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xff7700,
        transparent: true,
        opacity: .15,
        side: THREE.BackSide
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

scene.add(glow);


/* =========================
   PLANETAS
========================= */

const planets = [];

function crearPlaneta(
    radio,
    distancia,
    color,
    velocidad,
    anillos = false
) {

    const geometry =
        new THREE.SphereGeometry(
            radio,
            32,
            32
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: .7,
            metalness: .1
        });

    const planet =
        new THREE.Mesh(
            geometry,
            material
        );

    planet.userData = {
        distancia: distancia,
        velocidad: velocidad,
        angulo: Math.random() * Math.PI * 2
    };

    scene.add(planet);

    /* Órbita */

    const orbitGeometry =
        new THREE.RingGeometry(
            distancia - .3,
            distancia + .3,
            128
        );

    const orbitMaterial =
        new THREE.MeshBasicMaterial({
            color: 0x334466,
            transparent: true,
            opacity: .35,
            side: THREE.DoubleSide
        });

    const orbit =
        new THREE.Mesh(
            orbitGeometry,
            orbitMaterial
        );

    orbit.rotation.x =
        Math.PI / 2;

    scene.add(orbit);


    /* Anillos */

    if (anillos) {

        const ringGeometry =
            new THREE.RingGeometry(
                radio * 1.4,
                radio * 2.1,
                64
            );

        const ringMaterial =
            new THREE.MeshBasicMaterial({
                color: 0xddbb77,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: .8
            });

        const ring =
            new THREE.Mesh(
                ringGeometry,
                ringMaterial
            );

        ring.rotation.x =
            Math.PI / 2.5;

        planet.add(ring);
    }

    planets.push(planet);

    return planet;
}


/* Planetas */

crearPlaneta(
    4,
    55,
    0x888888,
    .018
);

crearPlaneta(
    7,
    85,
    0xffaa55,
    .013
);

crearPlaneta(
    9,
    120,
    0x3388ff,
    .009
);

crearPlaneta(
    6,
    155,
    0xff4422,
    .007
);

crearPlaneta(
    15,
    215,
    0xddaa77,
    .004,
    true
);

crearPlaneta(
    12,
    280,
    0x6688cc,
    .002
);


/* =========================
   LUNA
========================= */

const moonGeometry =
    new THREE.SphereGeometry(
        2.5,
        24,
        24
    );

const moonMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xaaaaaa
    });

const moon =
    new THREE.Mesh(
        moonGeometry,
        moonMaterial
    );

scene.add(moon);


/* =========================
   PARTÍCULAS FLOTANTES
========================= */

const particleGeometry =
    new THREE.BufferGeometry();

const particleCount = 1000;

const particlePositions =
    new Float32Array(
        particleCount * 3
    );

for (let i = 0; i < particleCount; i++) {

    particlePositions[i * 3] =
        (Math.random() - .5) * 800;

    particlePositions[i * 3 + 1] =
        (Math.random() - .5) * 400;

    particlePositions[i * 3 + 2] =
        (Math.random() - .5) * 800;
}

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({
        color: 0x66ccff,
        size: 1.2,
        transparent: true,
        opacity: .6
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(particles);


/* =========================
   CONTROLES TÁCTILES
========================= */

let rotX = 0;
let rotY = 0;

let targetRotX = 0;
let targetRotY = 0;

let lastX = 0;
let lastY = 0;

let touching = false;

renderer.domElement.addEventListener(
    "touchstart",
    e => {

        touching = true;

        lastX =
            e.touches[0].clientX;

        lastY =
            e.touches[0].clientY;
    }
);

renderer.domElement.addEventListener(
    "touchmove",
    e => {

        if (!touching) return;

        const x =
            e.touches[0].clientX;

        const y =
            e.touches[0].clientY;

        const dx =
            x - lastX;

        const dy =
            y - lastY;

        targetRotY += dx * .004;
        targetRotX += dy * .004;

        lastX = x;
        lastY = y;
    }
);

renderer.domElement.addEventListener(
    "touchend",
    () => {
        touching = false;
    }
);


/* =========================
   ZOOM CON RUEDA
========================= */

window.addEventListener(
    "wheel",
    e => {

        camera.position.z +=
            e.deltaY * .2;

        camera.position.z =
            Math.max(
                80,
                Math.min(
                    camera.position.z,
                    900
                )
            );
    }
);


/* =========================
   ANIMACIÓN
========================= */

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const time =
        clock.getElapsedTime();


    /* Galaxia */

    galaxy.rotation.y =
        time * .015;

    galaxy.rotation.z =
        Math.sin(time * .2) * .03;


    /* Estrellas */

    stars.rotation.y =
        time * .003;


    /* Partículas */

    particles.rotation.y =
        time * .006;

    particles.rotation.x =
        time * .002;


    /* Sol */

    sun.scale.setScalar(
        1 +
        Math.sin(time * 3) * .03
    );

    glow.scale.setScalar(
        1 +
        Math.sin(time * 2) * .08
    );


    /* Planetas */

    planets.forEach(
        planet => {

            planet.userData.angulo +=
                planet.userData.velocidad;

            const a =
                planet.userData.angulo;

            const d =
                planet.userData.distancia;

            planet.position.x =
                Math.cos(a) * d;

            planet.position.z =
                Math.sin(a) * d;

            planet.position.y =
                Math.sin(a * 2) * 2;

            planet.rotation.y += .01;
        }
    );


    /* Luna */

    const tierra = planets[2];

    moon.position.x =
        tierra.position.x +
        Math.cos(time * 2) * 16;

    moon.position.z =
        tierra.position.z +
        Math.sin(time * 2) * 16;

    moon.position.y =
        tierra.position.y;


    /* Cámara */

    rotX +=
        (targetRotX - rotX) * .05;

    rotY +=
        (targetRotY - rotY) * .05;

    camera.position.x =
        Math.sin(rotY) * 350;

    camera.position.y =
        100 + Math.sin(rotX) * 150;

    camera.position.z =
        Math.cos(rotY) * 350;

    camera.lookAt(0, 0, 0);


    renderer.render(
        scene,
        camera
    );
}


/* =========================
   RESIZE
========================= */

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


/* =========================
   INICIAR
========================= */

setTimeout(() => {

    document.getElementById("loading").style.display = "none";

}, 1000);

animate();

</script>

</body>
</html>
